name: Pubblica configurazione firmata
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [config.json, scripts/sign.py, .github/workflows/sign-config.yml]
permissions:
  contents: write
concurrency:
  group: signed-config
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography
      - name: Firma e verifica
        env:
          REMOTE_CONFIG_SIGNING_KEY: ${{ secrets.REMOTE_CONFIG_SIGNING_KEY }}
        run: python scripts/sign.py
      - name: Pubblica solo firma e chiave pubblica
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config-signed.json public-key.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish verified remote config"
          git push origin HEAD:main
